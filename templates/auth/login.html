{% extends "base.html" %}
{% block title %}Log in · Travel Desk{% endblock %}
{% block content %}
  <section class="auth-card">
    <div class="eyebrow">YOUR TRAVEL DESK</div>
    <h1>Welcome back</h1>
    <p class="muted">Log in to manage your upcoming trips.</p>
    <form method="post" class="stack-form">
      <label for="username">Username</label>
      <input id="username" name="username" required autofocus>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" required>

      <button class="button" type="submit">Log in</button>
    </form>
    <p class="form-footer">New to Travel Desk? <a href="{{ url_for('register') }}">Create an account</a></p>
  </section>
{% endblock %}
